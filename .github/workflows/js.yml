name: JS Regression

on:
  push:
    paths:
      - "src/**"
      - "scripts/test-js.js"
      - ".github/workflows/js.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/test-js.js"
      - ".github/workflows/js.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run JS regression suite
        run: node scripts/test-js.js
